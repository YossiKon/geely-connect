# =====================================================================
#  Geely Connect - PREMIUM dashboard (4 views, built-in cards only).
#  No HACS / custom cards required.
#
#  WHAT THIS IS
#    A complete multi-view dashboard: Overview, Charging, Climate and
#    Trip & Health.
#
#  WHERE TO PASTE IT
#    Settings -> Dashboards -> + Add dashboard -> New dashboard from
#    scratch -> open it -> pencil (Edit) -> top-right menu ->
#    "Raw configuration editor" -> select all, delete, paste EVERYTHING
#    below -> Save.
#
#  BEFORE YOU SAVE
#    Search-replace  my_geely_ex5  with your own entity suffix.
#    Find it in Settings -> Devices & Services -> Geely Connect -> your
#    car: an id like sensor.my_geely_ex5_battery means the suffix is
#    my_geely_ex5.
#
#  Entities your car does not report show as "unavailable" - just
#  delete that tile.
# =====================================================================
views:

  # ===================================================================
  #  VIEW 1 - OVERVIEW
  # ===================================================================
  - title: Overview
    path: overview
    icon: mdi:car-electric
    type: sections
    max_columns: 3
    badges:
      - type: entity
        entity: sensor.my_geely_ex5_battery
        color: green
      - type: entity
        entity: sensor.my_geely_ex5_electric_range
        color: blue
      # Hybrid only - a badge whose visibility entity does not exist stays hidden.
      - type: entity
        entity: sensor.my_geely_ex5_combined_range
        color: purple
        visibility:
          - condition: numeric_state
            entity: sensor.my_geely_ex5_fuel_level
            above: -1
      - type: entity
        entity: binary_sensor.my_geely_ex5_connected
      - type: entity
        entity: lock.my_geely_ex5_doors
    sections:

      # ---------------- Status at a glance ----------------
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: At a glance
            heading_style: title
            icon: mdi:car-info
          - type: markdown
            text_only: true
            content: |-
              {%- set b = states('sensor.my_geely_ex5_battery') %}
              {%- set r = states('sensor.my_geely_ex5_electric_range') %}
              {%- set plug = states('sensor.my_geely_ex5_charger_connection') %}
              {%- set lu = states('sensor.my_geely_ex5_last_updated') %}
              {#- Hybrids only. has_value() rules out unknown/unavailable AND a
                  missing entity, so on a battery-electric car every fuel branch
                  below simply does not render and the headline is unchanged. -#}
              {%- set fr = states('sensor.my_geely_ex5_fuel_range') if has_value('sensor.my_geely_ex5_fuel_range') else none %}
              {%- set engine = states('sensor.my_geely_ex5_engine_speed') | float(0) > 0 %}
              ## {{ b if b not in ['unknown', 'unavailable'] else '--' }} % - {{ r if r not in ['unknown', 'unavailable'] else '--' }} km{% if fr %} + {{ fr }} km fuel{% endif %}
              {% if plug == 'Charging' %}Charging now{% elif plug == 'Plugged in' %}Plugged in, not charging{% elif engine %}Engine running{% else %}Running on battery{% endif %} -
              {%- if is_state('lock.my_geely_ex5_doors', 'locked') %} doors locked{% else %} **doors unlocked**{% endif %} -
              {#- as_datetime needs the none default: without it any state that is
                  not a timestamp RAISES and the whole card renders as an error box.
                  has_value() does not help - it only rules out unknown, it cannot
                  promise the string parses. A local clock time rather than
                  relative_time(), which hands back its input unchanged for a future
                  timestamp and would print a raw UTC datetime mid-sentence. -#}
              {%- set seen = lu | as_datetime(none) %}
              {%- if seen %} updated {{ (seen | as_local).strftime('%H:%M') }}{% else %} no fresh data{% endif %}
            grid_options: {columns: 12}
          - type: tile
            entity: sensor.my_geely_ex5_battery
            name: Battery
            color: green
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.my_geely_ex5_electric_range
            name: Range
            color: blue
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.my_geely_ex5_charger_connection
            name: Charger
            icon: mdi:ev-plug-type2
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.my_geely_ex5_total_mileage
            name: Odometer
            icon: mdi:counter
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.my_geely_ex5_interior_temperature
            name: Interior
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.my_geely_ex5_exterior_temperature
            name: Exterior
            grid_options: {columns: 6}

      # ---------------- Fuel (hybrid / PHEV only) ----------------
      #  This whole section hides itself on a battery-electric car: the
      #  visibility condition tests an entity that only exists when the car
      #  has a tank, and a condition on a missing entity is false. So there is
      #  nothing to delete by hand on an EX5 - leave it in place.
      - type: grid
        visibility:
          - condition: numeric_state
            entity: sensor.my_geely_ex5_fuel_level
            above: -1
        cards:
          - type: heading
            heading: Fuel
            heading_style: title
            icon: mdi:gas-station
          - type: gauge
            entity: sensor.my_geely_ex5_fuel_level_percent
            name: Tank
            min: 0
            max: 100
            needle: true
            severity:
              green: 40
              yellow: 15
              red: 0
            grid_options: {columns: 6, rows: 3}
          - type: tile
            entity: sensor.my_geely_ex5_fuel_level
            name: In tank
            icon: mdi:fuel
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.my_geely_ex5_fuel_range
            name: Fuel range
            icon: mdi:map-marker-distance
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.my_geely_ex5_combined_range
            name: Combined range
            color: purple
            icon: mdi:road-variant
            grid_options: {columns: 6}
          - type: tile
            entity: binary_sensor.my_geely_ex5_fuel_flap
            name: Fuel flap
            grid_options: {columns: 6}

      # ---------------- Controls ----------------
      - type: grid
        cards:
          - type: heading
            heading: Controls
            heading_style: title
            icon: mdi:remote
          - type: tile
            entity: lock.my_geely_ex5_doors
            name: Doors
            features:
              - type: lock-commands
            grid_options: {columns: 12}
          - type: tile
            entity: climate.my_geely_ex5_climate
            name: Pre-Conditioning
            features:
              - type: climate-hvac-modes
                hvac_modes: [heat_cool, "off"]
              - type: target-temperature
            grid_options: {columns: 12}
          - type: tile
            entity: switch.my_geely_ex5_defrost
            name: Defrost
            icon: mdi:car-defrost-front
            grid_options: {columns: 6}
          - type: tile
            entity: switch.my_geely_ex5_charging
            name: Charging
            icon: mdi:battery-charging
            grid_options: {columns: 6}

      # ---------------- Quick actions ----------------
      - type: grid
        cards:
          - type: heading
            heading: Quick actions
            heading_style: title
            icon: mdi:flash
          - type: tile
            entity: button.my_geely_ex5_find_car
            name: Find car
            icon: mdi:car-search
            tap_action: {action: toggle}
            grid_options: {columns: 4}
          - type: tile
            entity: button.my_geely_ex5_unlock_trunk
            name: Trunk
            icon: mdi:car-back
            tap_action: {action: toggle}
            grid_options: {columns: 4}
          - type: tile
            entity: button.my_geely_ex5_refresh_data
            name: Refresh
            icon: mdi:refresh
            tap_action: {action: toggle}
            grid_options: {columns: 4}
          - type: tile
            entity: switch.my_geely_ex5_parking_comfort
            name: Parking comfort
            icon: mdi:seat-recline-extra
            grid_options: {columns: 6}
          - type: tile
            entity: switch.my_geely_ex5_g_clean
            name: G-Clean
            icon: mdi:air-filter
            grid_options: {columns: 6}

      # ---------------- Location ----------------
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Location
            heading_style: title
            icon: mdi:map-marker
          - type: map
            entities:
              - entity: device_tracker.my_geely_ex5_location
            theme_mode: auto
            auto_fit: true
            grid_options: {columns: 12, rows: 6}
          - type: tile
            entity: device_tracker.my_geely_ex5_location
            name: Position
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.my_geely_ex5_speed
            name: Speed
            icon: mdi:speedometer
            grid_options: {columns: 6}

      # ---------------- Security ----------------
      - type: grid
        cards:
          - type: heading
            heading: Doors & security
            heading_style: title
            icon: mdi:shield-car
          # Shows only while the car is unlocked - a gentle nudge.
          - type: conditional
            conditions:
              - condition: state
                entity: lock.my_geely_ex5_doors
                state: unlocked
            card:
              type: markdown
              content: "**The car is unlocked.**"
            grid_options: {columns: 12}
          - type: glance
            show_state: true
            columns: 3
            entities:
              - entity: binary_sensor.my_geely_ex5_door_driver
                name: Driver
              - entity: binary_sensor.my_geely_ex5_door_passenger
                name: Passenger
              - entity: binary_sensor.my_geely_ex5_door_rear_left
                name: Rear L
              - entity: binary_sensor.my_geely_ex5_door_rear_right
                name: Rear R
              - entity: binary_sensor.my_geely_ex5_trunk
                name: Trunk
              - entity: binary_sensor.my_geely_ex5_hood
                name: Hood
            grid_options: {columns: 12}
          - type: tile
            entity: binary_sensor.my_geely_ex5_connected
            name: Link to car
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.my_geely_ex5_last_updated
            name: Last updated
            grid_options: {columns: 6}

  # ===================================================================
  #  VIEW 2 - CHARGING
  # ===================================================================
  - title: Charging
    path: charging
    icon: mdi:ev-station
    type: sections
    max_columns: 3
    badges:
      - type: entity
        entity: sensor.my_geely_ex5_battery
        color: green
      - type: entity
        entity: sensor.my_geely_ex5_charger_connection
      - type: entity
        entity: sensor.my_geely_ex5_time_to_full_charge
    sections:

      # ---------------- State of charge ----------------
      - type: grid
        cards:
          - type: heading
            heading: State of charge
            heading_style: title
            icon: mdi:battery-high
          - type: gauge
            entity: sensor.my_geely_ex5_battery
            name: Battery
            min: 0
            max: 100
            needle: true
            severity:
              green: 50
              yellow: 20
              red: 0
            grid_options: {columns: 6, rows: 3}
          # Set max: to your car's realistic full-charge range in km.
          - type: gauge
            entity: sensor.my_geely_ex5_electric_range
            name: Range
            min: 0
            max: 450
            needle: true
            grid_options: {columns: 6, rows: 3}
          - type: tile
            entity: sensor.my_geely_ex5_charger_connection
            name: Charger
            icon: mdi:ev-plug-type2
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.my_geely_ex5_time_to_full_charge
            name: Time to full
            icon: mdi:timer-sand
            grid_options: {columns: 6}
          # How fast, when it will finish, and - when the answer to "how fast"
          # disappoints - the volts and amps that explain it. The car sends the
          # two legs but never their product, so this is the only place the
          # charge rate exists.
          - type: tile
            entity: sensor.my_geely_ex5_charging_power
            name: Charging now
            icon: mdi:lightning-bolt
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.my_geely_ex5_charge_complete
            name: Full at
            icon: mdi:calendar-clock
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.my_geely_ex5_charge_voltage
            name: Voltage
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.my_geely_ex5_charge_current
            name: Current
            grid_options: {columns: 6}

      # ---------------- Charge control ----------------
      - type: grid
        cards:
          - type: heading
            heading: Charge control
            heading_style: title
            icon: mdi:power-plug
          - type: tile
            entity: switch.my_geely_ex5_charging
            name: Charging
            icon: mdi:battery-charging
            grid_options: {columns: 6}
          - type: tile
            entity: binary_sensor.my_geely_ex5_charger_plug
            name: Cable
            icon: mdi:power-plug-outline
            grid_options: {columns: 6}
          - type: heading
            heading: Scheduled charging
            heading_style: subtitle
          - type: tile
            entity: switch.my_geely_ex5_scheduled_charging
            name: Schedule
            icon: mdi:calendar-clock
            grid_options: {columns: 12}
          - type: tile
            entity: time.my_geely_ex5_scheduled_charging_start
            name: Start
            icon: mdi:clock-start
            grid_options: {columns: 6}
          - type: tile
            entity: time.my_geely_ex5_scheduled_charging_end
            name: End
            icon: mdi:clock-end
            grid_options: {columns: 6}

      # ---------------- Efficiency ----------------
      - type: grid
        cards:
          - type: heading
            heading: Efficiency
            heading_style: title
            icon: mdi:leaf
          - type: tile
            entity: sensor.my_geely_ex5_efficiency
            name: Efficiency
            icon: mdi:gauge
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.my_geely_ex5_average_consumption
            name: Consumption
            icon: mdi:lightning-bolt
            grid_options: {columns: 6}
          - type: statistic
            entity: sensor.my_geely_ex5_total_mileage
            name: Driven, last 7 days
            stat_type: change
            period:
              rolling_window:
                duration:
                  days: 7
            grid_options: {columns: 6, rows: 2}
          - type: statistic
            entity: sensor.my_geely_ex5_efficiency
            name: Average efficiency, 7 days
            stat_type: mean
            period:
              rolling_window:
                duration:
                  days: 7
            grid_options: {columns: 6, rows: 2}

      # ---------------- History ----------------
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: History
            heading_style: title
            icon: mdi:chart-line
          - type: statistics-graph
            title: Battery, past week
            entities:
              - entity: sensor.my_geely_ex5_battery
                name: Battery
            days_to_show: 7
            period: hour
            chart_type: line
            stat_types:
              - mean
              - min
              - max
            grid_options: {columns: 12, rows: 6}
          # One card, deliberately tall. A history-graph stacks the state
          # ribbons above a line chart for the numeric entity, so the charger
          # state, the charging switch and the kW all share one x-axis - which
          # is how you read a session: plug-in, ramp, taper, stop. It only
          # needs the height to do it. At rows: 4 the ribbons collapsed to
          # slivers and the kW axis labels overlapped each other.
          - type: history-graph
            title: Charging activity, last 48 h
            hours_to_show: 48
            entities:
              - entity: sensor.my_geely_ex5_charger_connection
                name: Charger
              - entity: switch.my_geely_ex5_charging
                name: Charging
              - entity: sensor.my_geely_ex5_charging_power
                name: Power
            grid_options: {columns: 12, rows: 8}

  # ===================================================================
  #  VIEW 3 - CLIMATE
  # ===================================================================
  - title: Climate
    path: climate
    icon: mdi:air-conditioner
    type: sections
    max_columns: 3
    badges:
      - type: entity
        entity: sensor.my_geely_ex5_interior_temperature
      - type: entity
        entity: sensor.my_geely_ex5_exterior_temperature
      - type: entity
        entity: climate.my_geely_ex5_climate
    sections:

      # ---------------- Pre-conditioning ----------------
      - type: grid
        cards:
          - type: heading
            heading: Pre-conditioning
            heading_style: title
            icon: mdi:thermometer
          - type: thermostat
            entity: climate.my_geely_ex5_climate
            name: Pre-Conditioning
            features:
              - type: climate-hvac-modes
                hvac_modes: [heat_cool, "off"]
              - type: climate-preset-modes
                style: dropdown
            grid_options: {columns: 12}
          - type: tile
            entity: sensor.my_geely_ex5_interior_temperature
            name: Interior
            icon: mdi:home-thermometer
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.my_geely_ex5_exterior_temperature
            name: Exterior
            icon: mdi:thermometer-lines
            grid_options: {columns: 6}
          - type: history-graph
            title: Cabin vs outside, last 24 h
            hours_to_show: 24
            entities:
              - entity: sensor.my_geely_ex5_interior_temperature
                name: Interior
              - entity: sensor.my_geely_ex5_exterior_temperature
                name: Exterior
            grid_options: {columns: 12, rows: 4}

      # ---------------- Comfort ----------------
      - type: grid
        cards:
          - type: heading
            heading: Comfort
            heading_style: title
            icon: mdi:snowflake-melt
          - type: tile
            entity: switch.my_geely_ex5_defrost
            name: Defrost
            icon: mdi:car-defrost-front
            grid_options: {columns: 6}
          - type: tile
            entity: switch.my_geely_ex5_g_clean
            name: G-Clean
            icon: mdi:air-filter
            grid_options: {columns: 6}
          - type: tile
            entity: switch.my_geely_ex5_parking_comfort
            name: Parking comfort
            icon: mdi:seat-recline-extra
            grid_options: {columns: 12}

      # ---------------- Seat heating ----------------
      - type: grid
        cards:
          - type: heading
            heading: Seat heating
            heading_style: title
            icon: mdi:car-seat-heater
          - type: tile
            entity: select.my_geely_ex5_seat_heat_driver
            name: Driver
            features:
              - type: select-options
            grid_options: {columns: 6}
          - type: tile
            entity: select.my_geely_ex5_seat_heat_passenger
            name: Passenger
            features:
              - type: select-options
            grid_options: {columns: 6}
          - type: tile
            entity: select.my_geely_ex5_seat_heat_rear_left
            name: Rear left
            features:
              - type: select-options
            grid_options: {columns: 6}
          - type: tile
            entity: select.my_geely_ex5_seat_heat_rear_right
            name: Rear right
            features:
              - type: select-options
            grid_options: {columns: 6}

      # ---------------- Seat ventilation ----------------
      - type: grid
        cards:
          - type: heading
            heading: Seat ventilation
            heading_style: title
            icon: mdi:car-seat-cooler
          - type: tile
            entity: select.my_geely_ex5_seat_vent_driver
            name: Driver
            features:
              - type: select-options
            grid_options: {columns: 6}
          - type: tile
            entity: select.my_geely_ex5_seat_vent_passenger
            name: Passenger
            features:
              - type: select-options
            grid_options: {columns: 6}
          - type: tile
            entity: select.my_geely_ex5_seat_vent_rear_left
            name: Rear left
            features:
              - type: select-options
            grid_options: {columns: 6}
          - type: tile
            entity: select.my_geely_ex5_seat_vent_rear_right
            name: Rear right
            features:
              - type: select-options
            grid_options: {columns: 6}

      # ---------------- Airing out ----------------
      - type: grid
        cards:
          - type: heading
            heading: Airing out
            heading_style: title
            icon: mdi:car-door
          # Every entity in this section is DISABLED BY DEFAULT.
          # Enable them first: Settings -> Devices & Services -> Geely
          # Connect -> your car -> click the entity -> gear -> Enable.
          # Until then they show as "unavailable".
          - type: tile
            entity: switch.my_geely_ex5_window_ventilation
            name: Window ventilation
            icon: mdi:weather-windy
            grid_options: {columns: 12}
          # Disabled by default - enable on the device page first.
          - type: tile
            entity: cover.my_geely_ex5_all_windows
            name: Windows
            features:
              - type: cover-open-close
            grid_options: {columns: 4}
          # Disabled by default - enable on the device page first.
          - type: tile
            entity: cover.my_geely_ex5_sunroof
            name: Sunroof
            features:
              - type: cover-open-close
            grid_options: {columns: 4}
          # Disabled by default - enable on the device page first.
          - type: tile
            entity: cover.my_geely_ex5_sunshade
            name: Sunshade
            features:
              - type: cover-open-close
            grid_options: {columns: 4}

  # ===================================================================
  #  VIEW 4 - TRIP & HEALTH
  # ===================================================================
  - title: Trip & Health
    path: trip-health
    icon: mdi:clipboard-pulse
    type: sections
    max_columns: 3
    badges:
      - type: entity
        entity: sensor.my_geely_ex5_total_mileage
      - type: entity
        entity: sensor.my_geely_ex5_trip_meter
      - type: entity
        entity: sensor.my_geely_ex5_days_to_service
    sections:

      # ---------------- Trip ----------------
      - type: grid
        cards:
          - type: heading
            heading: Trip
            heading_style: title
            icon: mdi:map-marker-distance
          - type: tile
            entity: sensor.my_geely_ex5_total_mileage
            name: Odometer
            icon: mdi:counter
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.my_geely_ex5_trip_meter
            name: Trip meter
            icon: mdi:map-marker-path
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.my_geely_ex5_average_speed
            name: Average speed
            icon: mdi:speedometer-medium
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.my_geely_ex5_speed
            name: Speed now
            icon: mdi:speedometer
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.my_geely_ex5_engine_state
            name: Drivetrain
            icon: mdi:engine
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.my_geely_ex5_park_brake
            name: Park brake
            icon: mdi:car-brake-parking
            grid_options: {columns: 6}
          - type: tile
            entity: binary_sensor.my_geely_ex5_driver_seatbelt
            name: Driver seatbelt
            icon: mdi:seatbelt
            grid_options: {columns: 12}

      # ---------------- Electric vs petrol (hybrid / PHEV only) ----------------
      #  Hides itself on a battery-electric car - see the note in Overview.
      - type: grid
        visibility:
          - condition: numeric_state
            entity: sensor.my_geely_ex5_fuel_level
            above: -1
        cards:
          - type: heading
            heading: Electric vs petrol
            heading_style: title
            icon: mdi:call-split
          - type: markdown
            text_only: true
            content: |-
              {#- The two lifetime odometers add up to the total odometer, so
                  their ratio is the share of driving actually done on battery.
                  Guarded against the both-zero case on a delivery-fresh car,
                  where the ratio is undefined rather than 0 %. -#}
              {%- set e = states('sensor.my_geely_ex5_mileage_on_battery') | float(0) %}
              {%- set f = states('sensor.my_geely_ex5_mileage_on_fuel') | float(0) %}
              {%- set total = e + f %}
              {%- if total > 0 %}
              ## {{ (100 * e / total) | round(0) }} % electric
              {{ e | round(1) }} km on battery, {{ f | round(1) }} km on petrol, over {{ total | round(1) }} km total.
              {%- else %}
              ## -- % electric
              No distance recorded yet.
              {%- endif %}
            grid_options: {columns: 12}
          - type: tile
            entity: sensor.my_geely_ex5_mileage_on_battery
            name: On battery
            color: green
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.my_geely_ex5_mileage_on_fuel
            name: On petrol
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.my_geely_ex5_fuel_consumption
            name: Fuel use, lifetime
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.my_geely_ex5_trip_fuel_consumption
            name: Fuel use, trip
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.my_geely_ex5_trip_consumption
            name: Power use, trip
            color: blue
            grid_options: {columns: 12}

      # ---------------- Engine (hybrid / PHEV only) ----------------
      #  Hides itself on a battery-electric car - see the note in Overview.
      - type: grid
        visibility:
          - condition: numeric_state
            entity: sensor.my_geely_ex5_fuel_level
            above: -1
        cards:
          - type: heading
            heading: Engine
            heading_style: title
            icon: mdi:engine
          - type: tile
            entity: sensor.my_geely_ex5_engine_speed
            name: Engine speed
            icon: mdi:speedometer
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.my_geely_ex5_engine_coolant_temperature
            name: Coolant
            grid_options: {columns: 6}
          - type: gauge
            entity: sensor.my_geely_ex5_engine_oil_health
            name: Oil health
            min: 0
            max: 100
            needle: true
            severity:
              green: 40
              yellow: 20
              red: 0
            grid_options: {columns: 6, rows: 3}
          - type: tile
            entity: sensor.my_geely_ex5_engine_hours_to_service
            name: Hours to service
            icon: mdi:wrench-clock
            grid_options: {columns: 6}

      # ---------------- 12 V system ----------------
      - type: grid
        cards:
          - type: heading
            heading: 12 V system
            heading_style: title
            icon: mdi:car-battery
          - type: gauge
            entity: sensor.my_geely_ex5_12v_battery
            name: 12V battery
            min: 0
            max: 100
            needle: true
            severity:
              green: 60
              yellow: 40
              red: 0
            grid_options: {columns: 6, rows: 3}
          - type: tile
            entity: sensor.my_geely_ex5_12v_voltage
            name: 12V voltage
            icon: mdi:flash-triangle
            grid_options: {columns: 6}

      # ---------------- Service ----------------
      - type: grid
        cards:
          - type: heading
            heading: Service
            heading_style: title
            icon: mdi:wrench-clock
          - type: tile
            entity: sensor.my_geely_ex5_days_to_service
            name: Days to service
            icon: mdi:calendar-alert
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.my_geely_ex5_distance_to_service
            name: Distance to service
            icon: mdi:road-variant
            grid_options: {columns: 6}
          - type: tile
            entity: binary_sensor.my_geely_ex5_connected
            name: Link to car
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.my_geely_ex5_last_updated
            name: Last updated
            grid_options: {columns: 6}
          - type: tile
            entity: button.my_geely_ex5_refresh_data
            name: Refresh now
            icon: mdi:refresh
            tap_action: {action: toggle}
            grid_options: {columns: 12}

      # ---------------- Tires ----------------
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Tire pressure
            heading_style: title
            icon: mdi:car-tire-alert
          - type: tile
            entity: sensor.my_geely_ex5_tire_pressure_fl
            name: Front left
            icon: mdi:tire
            grid_options: {columns: 3}
          - type: tile
            entity: sensor.my_geely_ex5_tire_pressure_fr
            name: Front right
            icon: mdi:tire
            grid_options: {columns: 3}
          - type: tile
            entity: sensor.my_geely_ex5_tire_pressure_rl
            name: Rear left
            icon: mdi:tire
            grid_options: {columns: 3}
          - type: tile
            entity: sensor.my_geely_ex5_tire_pressure_rr
            name: Rear right
            icon: mdi:tire
            grid_options: {columns: 3}
          - type: history-graph
            title: Tire pressure, last 7 days
            hours_to_show: 168
            entities:
              - entity: sensor.my_geely_ex5_tire_pressure_fl
                name: Front left
              - entity: sensor.my_geely_ex5_tire_pressure_fr
                name: Front right
              - entity: sensor.my_geely_ex5_tire_pressure_rl
                name: Rear left
              - entity: sensor.my_geely_ex5_tire_pressure_rr
                name: Rear right
            grid_options: {columns: 12, rows: 5}
