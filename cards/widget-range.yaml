# =====================================================================
#  Geely Connect - COMPACT RANGE & HEALTH WIDGET (single built-in card).
#
#  What it is : range right now, plus the two computed health figures -
#               Range At Full Charge (what the car would show at 100%)
#               and Efficiency (km per kWh) - as tiles, then a 30-day
#               statistics graph of Range At Full Charge underneath, so
#               pack degradation or a seasonal winter dip is visible
#               instead of hiding inside day-to-day noise.
#               Narrow enough for a sidebar / phone column.
#
#  Where to paste : your dashboard -> Edit dashboard (pencil, top right)
#                   -> Add card -> scroll to the bottom -> Manual ->
#                   delete the sample YAML -> paste everything below
#                   this comment block (from "type: vertical-stack"
#                   downwards) -> Save.
#
#  Before saving : search-replace  my_geely_ex5  with your own entity
#                  suffix (Settings -> Devices & services ->
#                  Geely Connect -> your car -> any entity id).
#                  This widget only displays, it never acts, so there is
#                  no notify service in here to change.
#
#  Anything your car does not report shows as "unavailable", and the two
#  computed figures read "unknown" whenever they cannot be worked out -
#  just delete a tile you never see a value on.
# =====================================================================
type: vertical-stack
cards:
  # The charge badge is here on purpose: it is the fastest way to see why
  # the "At 100%" tile below is blank (see the note on that tile).
  # Heading badges need Home Assistant 2024.11 or newer - on older
  # versions delete the "badges:" block, the rest still works.
  - type: heading
    heading: Range & health
    heading_style: title
    icon: mdi:map-marker-distance
    badges:
      - type: entity
        entity: sensor.my_geely_ex5_battery
        show_state: true
        show_icon: true

  # What the car is telling you today, at today's charge level.
  - type: tile
    entity: sensor.my_geely_ex5_electric_range
    name: Range now
    icon: mdi:map-marker-distance
    color: blue

  - type: grid
    columns: 2
    square: false
    cards:
      # BLANK BELOW 10% CHARGE - this is deliberate, not a broken entity.
      # Range At Full Charge is the remaining range extrapolated up to a
      # full pack, so it divides by the charge level; under 10% that
      # division amplifies rounding into nonsense, and the integration
      # reports "unknown" instead of a wrong number. It fills back in on
      # the first poll above 10%.
      - type: tile
        entity: sensor.my_geely_ex5_range_at_full_charge
        name: At 100%
        icon: mdi:map-marker-path
        color: green

      # Derived from average consumption (the car reports kWh/100km).
      # Higher is better - cold weather and motorway speeds push it down.
      - type: tile
        entity: sensor.my_geely_ex5_efficiency
        name: Efficiency
        icon: mdi:leaf
        color: teal

  # One point per day for 30 days. Because every point is normalised to a
  # full pack, the trend is comparable week to week: a slow steady slide
  # is pack ageing, a dip that recovers when the weather warms up is
  # seasonal.
  #
  # Two things that look like faults but are not:
  #   * Gaps in the line = whole days with nothing to record: the car
  #     stayed below 10% charge (same reason as the blank tile above),
  #     or Home Assistant / the connection was down all day.
  #   * An empty graph for the first day or two = long-term statistics
  #     are still being collected; they are written every 5 minutes and
  #     rolled up hourly, so give it a day before judging it.
  #
  # The y-axis follows the data on its own, so a few percent of loss on a
  # ~400 km figure stays visible. To pin the window instead, add
  # "min_y_axis:" just below and "max_y_axis:" just above your usual
  # range - plus "fit_y_data: true" if you still want an outlier to be
  # able to push those two bounds outwards.
  # "mean" alone keeps the trend readable on a narrow card - add "min"
  # and "max" to stat_types if you also want the daily spread.
  - type: statistics-graph
    title: Range at full charge - 30 days
    entities:
      - entity: sensor.my_geely_ex5_range_at_full_charge
        name: At 100%
    days_to_show: 30
    period: day
    stat_types:
      - mean
    chart_type: line
