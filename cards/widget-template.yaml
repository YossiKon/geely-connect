# =====================================================================
#  Geely Connect - WIDGET TEMPLATE (starter card to copy).
#
#  What it is : a working card that doubles as a worked example. Each
#               block below is one Lovelace pattern worth knowing -
#               heading, tile grid, tiles you can act from, gauge with
#               colour bands, conditional, glance row, history graph,
#               and a markdown card with a template in it. Paste the
#               whole thing, confirm it renders, then delete the blocks
#               you do not want and repoint the rest at your entities.
#
#  Where to paste : your dashboard -> Edit dashboard (pencil, top right)
#                   -> Add card -> scroll to the bottom -> Manual ->
#                   delete the sample YAML -> paste everything below
#                   this comment block (from "type: vertical-stack"
#                   downwards) -> Save.
#
#  Before saving : search-replace  my_geely_ex5  with your own entity
#                  suffix (Settings -> Devices and services ->
#                  Geely Connect -> your car -> any entity id).
#
#  KEEP THIS FILE. A normal dashboard stores its cards as JSON, so the
#  moment you press Save every comment here is thrown away - the card
#  keeps working, the explanations do not survive. Edit this file and
#  re-paste when you want them back, or use a YAML-mode dashboard,
#  where the comments stay in the file.
#
#  Anything your trim does not report shows as "unavailable" - delete
#  that tile or row.
# =====================================================================
type: vertical-stack
cards:
  # --- 1. HEADING ---------------------------------------------------
  # Titles the widget. Change "heading:" for the text and "icon:" for
  # the icon; neither is tied to an entity.
  # The badge on the right is the one part that shows live state -
  # change its "entity:" line to put a different value up here.
  # Badges need Home Assistant 2024.11 or newer; on an older core
  # delete the "badges:" block and the heading still works.
  - type: heading
    heading: My widget
    heading_style: title
    icon: mdi:car-electric
    badges:
      - type: entity
        entity: sensor.my_geely_ex5_battery
        show_state: true
        show_icon: true

  # --- 2. A GRID OF TILES -------------------------------------------
  # The workhorse: read-only values, two per row. To repoint any tile,
  # change that tile's "entity:" line - nothing else in the tile
  # depends on it. "columns: 2" sets the width of the whole grid, and
  # "square: false" keeps the tiles short instead of boxy.
  # The battery tile deliberately has no "icon:" - that sensor carries
  # device_class "battery", so Home Assistant draws a live level icon
  # (with a charging bolt) as long as you do not override it.
  - type: grid
    columns: 2
    square: false
    cards:
      - type: tile
        entity: sensor.my_geely_ex5_battery
        name: Battery
        color: green
      - type: tile
        entity: sensor.my_geely_ex5_electric_range
        name: Range
        icon: mdi:map-marker-distance
        color: blue
      - type: tile
        entity: sensor.my_geely_ex5_interior_temperature
        name: Interior
        icon: mdi:thermometer
        color: orange
      - type: tile
        entity: sensor.my_geely_ex5_total_mileage
        name: Odometer
        icon: mdi:counter

  # --- 3. TILES YOU CAN ACT FROM ------------------------------------
  # "features:" is what turns a tile from a readout into a control.
  # Change "entity:" to move a tile to another car - but a feature only
  # works on its own domain: lock-commands needs a lock.* entity, the
  # climate-* features need a climate.* entity. Swap the entity for
  # something else and you must swap the feature too.
  # "off" stays quoted: bare off is the boolean false in YAML.
  - type: tile
    entity: lock.my_geely_ex5_doors
    name: Doors
    icon: mdi:car-door-lock
    features:
      - type: lock-commands
  - type: tile
    entity: climate.my_geely_ex5_climate
    name: Pre-Conditioning
    icon: mdi:air-conditioner
    features:
      - type: climate-hvac-modes
        hvac_modes:
          - heat_cool
          - "off"
      - type: target-temperature

  # --- 4. GAUGE WITH COLOUR BANDS -----------------------------------
  # Change "entity:" to any numeric sensor, then set "min:" and "max:"
  # to that sensor's real range or the needle sits at one end forever.
  # Each severity key is the LOWER bound of its band, so this reads
  # red 0-20, yellow 20-40, green 40-100. All three are set, so every
  # reading gets an explicit colour. For a sensor where low is good,
  # keep the same three keys and give red the highest number.
  - type: gauge
    entity: sensor.my_geely_ex5_battery
    name: Charge
    min: 0
    max: 100
    needle: false
    severity:
      red: 0
      yellow: 20
      green: 40

  # --- 5. CONDITIONAL: ONLY VISIBLE IN ONE STATE --------------------
  # Hides its inner card unless the condition matches - better than a
  # tile showing a stale number the rest of the time.
  # Repointing this block means editing two entity lines: the condition
  # has its own "entity:" (what is being watched) and the inner card
  # has another (what gets shown), plus "state:" to match.
  # That state string is the raw sensor state and is NOT translated, so
  # leave "Charging" spelled exactly like this in any language.
  - type: conditional
    conditions:
      - condition: state
        entity: sensor.my_geely_ex5_charger_connection
        state: Charging
    card:
      type: tile
      entity: sensor.my_geely_ex5_time_to_full_charge
      name: Time to full
      icon: mdi:battery-clock
      color: green

  # --- 6. GLANCE ROW ------------------------------------------------
  # Many entities in little space - right for on/off things you only
  # want to scan. Each entry is its own "- entity:" line, so add,
  # remove or repoint one line at a time; "columns:" sets how many fit
  # per row. "state_color: true" lights up anything that is "on",
  # which is what makes an open door jump out.
  - type: glance
    columns: 4
    state_color: true
    show_name: true
    show_state: true
    entities:
      - entity: binary_sensor.my_geely_ex5_door_driver
        name: Driver
      - entity: binary_sensor.my_geely_ex5_door_passenger
        name: Passenger
      - entity: binary_sensor.my_geely_ex5_door_rear_left
        name: Rear L
      - entity: binary_sensor.my_geely_ex5_door_rear_right
        name: Rear R
      - entity: binary_sensor.my_geely_ex5_trunk
        name: Trunk
      - entity: binary_sensor.my_geely_ex5_hood
        name: Hood
      - entity: binary_sensor.my_geely_ex5_driver_seatbelt
        name: Seatbelt
      - entity: binary_sensor.my_geely_ex5_connected
        name: Car link
        icon: mdi:car-connected

  # --- 7. HISTORY GRAPH ---------------------------------------------
  # Recent history, straight from the recorder - no setup needed.
  # There are two "- entity:" lines here, one per line on the chart, so
  # repointing this block means editing both. Everything plotted
  # together shares one y-axis: keep entities of the same unit in one
  # graph (two temperatures here) and give a percentage or a distance
  # its own. "hours_to_show: 24" is the window - 168 gives a week.
  # For months of data use a statistics-graph card instead; history is
  # purged after ten days by default.
  - type: history-graph
    title: Cabin against outside - 24 hours
    hours_to_show: 24
    entities:
      - entity: sensor.my_geely_ex5_interior_temperature
        name: Interior
      - entity: sensor.my_geely_ex5_exterior_temperature
        name: Exterior

  # --- 8. MARKDOWN WITH A TEMPLATE ----------------------------------
  # The escape hatch: free text, and the only built-in card where Jinja
  # runs. Use it to combine values into a sentence no tile can express.
  # Every entity id lives in the "set" lines at the top, so repointing
  # is done up there and the wording below stays untouched.
  #
  # The three guards worth copying, in order of appearance:
  #   has_value()  - true only when the entity exists and is neither
  #                  unknown nor unavailable. Ask this before printing
  #                  anything, and give the else branch real words.
  #   | float(0)   - makes sure what you have is a number before you
  #                  round it. Use it where 0 is an honest answer, and
  #                  never as a stand-in for a missing reading, or the
  #                  card prints a plausible figure that is not true.
  #   is not none  - the guard for everything that is not a plain
  #                  state. state_attr() hands back none when the car
  #                  has not reported that attribute, and the default
  #                  in "| as_datetime(none)" hands back none instead
  #                  of raising when the state is not a timestamp -
  #                  as_datetime with no default raises there, and
  #                  strftime and relative_time both raise on none.
  #                  Test for none first; as_local() then turns the
  #                  UTC timestamp into your own clock.
  # Charge complete is unknown unless the car is charging, so its else
  # branch is the normal case - which is exactly the point.
  # Each of the four tires also carries psi, bar and kPa attributes, so
  # state_attr() can take the unit you want whatever the tile shows.
  - type: markdown
    content: |-
      {%- set batt = 'sensor.my_geely_ex5_battery' -%}
      {%- set rng = 'sensor.my_geely_ex5_electric_range' -%}
      {%- set tire = 'sensor.my_geely_ex5_tire_front_left' -%}
      {%- set done = 'sensor.my_geely_ex5_charge_complete' -%}
      {%- set psi = state_attr(tire, 'psi') -%}
      {%- set done_at = states(done) | as_datetime(none) -%}
      ### Right now

      {% if has_value(batt) and has_value(rng) -%}
      Battery **{{ states(batt) | float(0) | round | int }}%**, about
      **{{ states(rng) | float(0) | round | int }} km** left.
      {%- else -%}
      The car has not reported a charge level yet.
      {%- endif %}

      {% if psi is not none -%}
      Front-left tire
      **{{ psi | float(0) | round(1) }} psi**.
      {%- else -%}
      No tire pressure reported.
      {%- endif %}

      {% if done_at is not none -%}
      Charging finishes at **{{ as_local(done_at).strftime('%H:%M') }}**.
      {%- else -%}
      Not charging, so there is no finish time to show.
      {%- endif %}

  # --- ADDING YOUR OWN ----------------------------------------------
  # Copy any block above, paste it here, and change its "entity:" line
  # or lines. The "- type:" must line up with the ones above it (two
  # spaces in) and everything belonging to that block goes another two
  # spaces deeper. Spaces only - a tab anywhere and Home Assistant
  # refuses to load the card.
