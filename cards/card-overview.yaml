# =====================================================================
#  Geely Connect - OVERVIEW card (self-contained vertical-stack).
#  The one card to add if you only ever add one: the four numbers that
#  matter, door lock + climate controls, quick actions, and a charging
#  panel that only appears while the car is actually charging.
#
#  WHERE TO PASTE:
#    Dashboard -> pencil (Edit) -> + Add card -> scroll down to
#    "Manual" -> delete the sample content -> paste this whole file.
#
#  BEFORE YOU SAVE:
#    Search-replace  my_geely_ex5  with your own entity suffix (see any
#    entity id on the device page, e.g. sensor.<your_suffix>_battery).
#  Built-in cards only - no HACS, no custom resources required.
# =====================================================================
type: vertical-stack
cards:
  - type: heading
    heading: My Geely EX5
    heading_style: title
    icon: mdi:car-electric

  # --- The four numbers that matter -----------------------------------
  - type: grid
    columns: 2
    square: false
    cards:
      # No icon: override here - the battery sensor is device_class
      # "battery", so HA draws a live level icon (and a charging bolt).
      - type: tile
        entity: sensor.my_geely_ex5_battery
        name: Battery
        color: green
      - type: tile
        entity: sensor.my_geely_ex5_electric_range
        name: Range
        icon: mdi:map-marker-distance
        color: blue
      - type: tile
        entity: sensor.my_geely_ex5_interior_temperature
        name: Interior
        icon: mdi:thermometer
        color: orange
      - type: tile
        entity: sensor.my_geely_ex5_charger_connection
        name: Charger
        icon: mdi:ev-plug-type2

  # --- Controls (interactive - act straight from the tile) ------------
  - type: tile
    entity: lock.my_geely_ex5_doors
    name: Doors
    icon: mdi:car-door-lock
    features:
      - type: lock-commands
  - type: tile
    entity: climate.my_geely_ex5_climate
    name: Climate
    icon: mdi:air-conditioner
    features:
      - type: climate-hvac-modes
        hvac_modes:
          - heat_cool
          - "off"
      - type: target-temperature

  # --- Quick actions --------------------------------------------------
  - type: grid
    columns: 3
    square: false
    cards:
      - type: tile
        entity: button.my_geely_ex5_find_car
        name: Find car
        icon: mdi:car-search
        vertical: true
        tap_action:
          action: toggle
      - type: tile
        entity: button.my_geely_ex5_unlock_trunk
        name: Trunk
        icon: mdi:car-back
        vertical: true
        tap_action:
          action: toggle
      - type: tile
        entity: button.my_geely_ex5_refresh_data
        name: Refresh
        icon: mdi:refresh
        vertical: true
        tap_action:
          action: toggle

  # --- Only visible while the car is charging -------------------------
  # The state string below is the raw sensor state and is NOT translated,
  # so leave "Charging" spelled exactly like this in any language.
  - type: conditional
    conditions:
      - condition: state
        entity: sensor.my_geely_ex5_charger_connection
        state: Charging
    card:
      type: grid
      columns: 2
      square: false
      cards:
        - type: tile
          entity: sensor.my_geely_ex5_time_to_full_charge
          name: Time to full
          icon: mdi:timer-sand
          color: green
        - type: tile
          entity: switch.my_geely_ex5_charging
          name: Charging
          icon: mdi:ev-station
          color: green
