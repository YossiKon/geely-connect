# =====================================================================
#  Geely Connect — COMPACT TIRE-PRESSURE WIDGET (single built-in card).
#  The four tiles are laid out like the car seen from above:
#    front-left | front-right
#    rear-left  | rear-right
#  The history graph underneath plots all four together, so one line
#  drifting away from the others = a slow leak.
#
#  Paste it in:  your dashboard → Edit dashboard (pencil, top right) →
#                Add card → scroll to the bottom → Manual → replace the
#                sample YAML with everything below this comment block.
#
#  Before saving: search-replace  my_geely_ex5  with your own entity
#  suffix (see Settings → Devices & services → Geely Connect → your car).
#
#  The pressure unit (psi / bar / kPa) is whatever you picked during
#  setup — it comes from the entities themselves, so nothing here needs
#  changing if you switch units later.
# =====================================================================
type: vertical-stack
cards:
  - type: heading
    heading: Tire pressure
    heading_style: title
    icon: mdi:car-tire-alert

  # 2x2 grid mirroring the car: front axle on top, rear axle below.
  - type: grid
    columns: 2
    square: false
    cards:
      - type: tile
        entity: sensor.my_geely_ex5_tire_pressure_fl
        name: Front left
      - type: tile
        entity: sensor.my_geely_ex5_tire_pressure_fr
        name: Front right
      - type: tile
        entity: sensor.my_geely_ex5_tire_pressure_rl
        name: Rear left
      - type: tile
        entity: sensor.my_geely_ex5_tire_pressure_rr
        name: Rear right

  # One week of history. A tire that loses pressure slowly shows up as a
  # line sloping down and away from the other three.
  - type: history-graph
    title: Last 7 days
    hours_to_show: 168
    entities:
      - entity: sensor.my_geely_ex5_tire_pressure_fl
        name: Front left
      - entity: sensor.my_geely_ex5_tire_pressure_fr
        name: Front right
      - entity: sensor.my_geely_ex5_tire_pressure_rl
        name: Rear left
      - entity: sensor.my_geely_ex5_tire_pressure_rr
        name: Rear right
