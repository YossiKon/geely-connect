# =====================================================================
#  Geely Connect - SECURITY WIDGET (compact, built-in cards only).
#  Lock control + every opening at a glance + a red banner whenever
#  the car is left open.
#
#  Add via:  Edit dashboard → Add card → Manual → paste this file.
#  Replace  my_geely_ex5  with your entity suffix if it differs
#  (Settings → Devices & Services → Geely Connect → your car → entity_id).
#
#  Needs Home Assistant 2024.9 or newer - that is the heading card, which
#  is the newest thing used here. The warning banner additionally needs
#  the "or" condition (2024.2+). On an older core the heading renders as
#  an error card and/or the banner never appears; the lock tile and the
#  glance row still work.
# =====================================================================
type: vertical-stack
cards:
  - type: heading
    heading: Security
    heading_style: title
    icon: mdi:shield-car

  # --- Red banner: shown only while something is actually open. ------
  # The condition list is deliberately limited to the four doors, the
  # trunk and the hood. The seatbelt and the connection sensor are
  # status only and never trigger the warning.
  - type: conditional
    conditions:
      - condition: or
        conditions:
          - condition: state
            entity: binary_sensor.my_geely_ex5_door_driver
            state: "on"
          - condition: state
            entity: binary_sensor.my_geely_ex5_door_passenger
            state: "on"
          - condition: state
            entity: binary_sensor.my_geely_ex5_door_rear_left
            state: "on"
          - condition: state
            entity: binary_sensor.my_geely_ex5_door_rear_right
            state: "on"
          - condition: state
            entity: binary_sensor.my_geely_ex5_trunk
            state: "on"
          - condition: state
            entity: binary_sensor.my_geely_ex5_hood
            state: "on"
    card:
      type: markdown
      content: |-
        {%- set openings = {
          'binary_sensor.my_geely_ex5_door_driver': 'Driver door',
          'binary_sensor.my_geely_ex5_door_passenger': 'Passenger door',
          'binary_sensor.my_geely_ex5_door_rear_left': 'Rear left door',
          'binary_sensor.my_geely_ex5_door_rear_right': 'Rear right door',
          'binary_sensor.my_geely_ex5_trunk': 'Trunk',
          'binary_sensor.my_geely_ex5_hood': 'Hood' } -%}
        {%- set ns = namespace(items=[]) -%}
        {%- for eid, label in openings.items() -%}
          {%- if is_state(eid, 'on') -%}
            {%- set ns.items = ns.items + [label] -%}
          {%- endif -%}
        {%- endfor -%}
        <ha-alert alert-type="error" title="Car is not secure">{{ ns.items | join(' · ') }} still open</ha-alert>

  # --- Central lock ------------------------------------------------
  - type: tile
    entity: lock.my_geely_ex5_doors
    name: Doors
    icon: mdi:car-door-lock
    features:
      - type: lock-commands

  # --- Everything that can be open, plus the link to the car -------
  # state_color lights up any tile that is "on". For the openings and
  # the seatbelt that means "look at me"; for Car link a lit tile is
  # the good state - Home Assistant is reaching the vehicle.
  - type: glance
    columns: 4
    state_color: true
    show_name: true
    show_state: true
    entities:
      - entity: binary_sensor.my_geely_ex5_door_driver
        name: Driver
      - entity: binary_sensor.my_geely_ex5_door_passenger
        name: Passenger
      - entity: binary_sensor.my_geely_ex5_door_rear_left
        name: Rear L
      - entity: binary_sensor.my_geely_ex5_door_rear_right
        name: Rear R
      - entity: binary_sensor.my_geely_ex5_trunk
        name: Trunk
      - entity: binary_sensor.my_geely_ex5_hood
        name: Hood
      - entity: binary_sensor.my_geely_ex5_driver_seatbelt
        name: Seatbelt
      - entity: binary_sensor.my_geely_ex5_connected
        name: Car link
        icon: mdi:car-connected
