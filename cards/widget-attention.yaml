# =====================================================================
#  Geely Connect - NEEDS ATTENTION WIDGET (built-in cards only).
#
#  What it is : one markdown card that stays quiet. It lists ONLY the
#               things that want action right now - something left open,
#               the car unlocked, a low battery, a soft tire, a weak 12V,
#               a service coming up, or Home Assistant having lost
#               contact with the car. When there is nothing to report it
#               prints a single green line and nothing else. A refresh
#               button sits underneath, so you can re-poll the car and
#               watch a line clear.
#
#  Where to paste : your dashboard -> Edit dashboard (pencil, top right)
#                   -> Add card -> scroll to the bottom -> Manual ->
#                   delete the sample YAML -> paste everything below this
#                   comment block (from "type: vertical-stack" downwards)
#                   -> Save.
#
#  Before saving : search-replace  my_geely_ex5  with your own entity
#                  suffix (Settings -> Devices & services ->
#                  Geely Connect -> your car -> any entity id).
#
#  Tuning : all five thresholds sit in one block at the top of the
#           markdown card's "content:" - they are described in the
#           comment just above that card.
#
#  Nothing here has to exist. Every check first asks whether its sensor
#  actually holds a value, so a figure your car never reports simply
#  never produces a line. Missing values always fall back to a SAFE
#  number, which means a car that has not reported stays silent rather
#  than inventing alarms.
#
#  If you would rather this matched the other widgets and always carried
#  a title, add a heading card above the markdown one (heading needs
#  Home Assistant 2024.9 or newer):
#      - type: heading
#        heading: Needs attention
#        heading_style: title
#        icon: mdi:clipboard-alert-outline
# =====================================================================
type: vertical-stack
cards:
  # -------------------------------------------------------------------
  #  THE ONLY NUMBERS WORTH CHANGING are the five in the "set" block at
  #  the very top of content: below.
  #
  #    tire_min_psi    28  Soft-tire warning, IN PSI. 28 is a
  #                        conservative figure for the usual 33-36 psi
  #                        door-jamb placard - raise it to be warned
  #                        earlier, lower it if cold mornings nag you.
  #                        Check the placard in your driver door jamb.
  #                        This card reads the "psi" ATTRIBUTE that the
  #                        four tire sensors carry, never their state, so
  #                        28 stays 28 whether your sensors are set to
  #                        display psi, bar or kPa. (Contrast
  #                        automations/comfort-and-maintenance.yaml,
  #                        which compares against the state and so has to
  #                        restate its threshold per unit.)
  #    batt_min        20  Traction battery %, warn below this.
  #    v12_min         60  12V battery %, warn below this.
  #    service_days    30  Warn when the next service is this close.
  #    service_km    1000  ...or this close in kilometres.
  # -------------------------------------------------------------------
  - type: markdown
    content: |-
      {#- ================= THRESHOLDS - tune these ================= -#}
      {%- set tire_min_psi = 28 -%}
      {%- set batt_min     = 20 -%}
      {%- set v12_min      = 60 -%}
      {%- set service_days = 30 -%}
      {%- set service_km   = 1000 -%}
      {#- =========================================================== -#}

      {#- Every field this template appends to has to be declared here in
          one go. Each line below is "ns.x = ns.x + [...]", which READS
          the field before writing it, and reading a namespace field that
          was never declared raises - a raising template renders as an
          error box instead of a card. -#}
      {%- set ns = namespace(items=[], open=[], low=[], svc=[], urgent=false) -%}

      {#- 1. Contact with the car. This sensor is on whenever the last
             poll succeeded, so it means "the integration cannot reach
             the car", NOT "the car is asleep" - a parked car will not
             trip it. Deliberately first in the list: while it is off,
             every figure below is simply the last one that got through,
             and can be hours old.
             Testing for 'off' rather than "not on" is on purpose. The
             entity never goes unavailable, so 'off' is the only state
             that means trouble, and this way a mistyped entity id (or
             the moments before the first poll) leaves the card quiet
             instead of stuck on a warning.
             The time of the last good poll is printed as a local clock
             time. as_datetime(none) turns "unknown" - or a sensor that
             is not there at all - into none rather than raising, and the
             "if seen" below then drops the whole bracket. as_local moves
             the stored UTC timestamp into your own time zone; do not
             print the raw state, which is UTC and unreadable. -#}
      {%- if is_state('binary_sensor.my_geely_ex5_connected', 'off') -%}
        {%- set seen = states('sensor.my_geely_ex5_last_updated') | as_datetime(none) -%}
        {%- set seen_txt = (' (last good poll ' ~ (seen | as_local).strftime('%H:%M on %d %b') ~ ')') if seen else '' -%}
        {%- set ns.items = ns.items + ['**No contact with the car** - anything below may be stale' ~ seen_txt] -%}
      {%- endif -%}

      {#- 2. Anything physically open. Seatbelt and charger plug are
             status, not a problem, so they are not checked here. -#}
      {%- set openings = {
        'binary_sensor.my_geely_ex5_door_driver': 'driver door',
        'binary_sensor.my_geely_ex5_door_passenger': 'passenger door',
        'binary_sensor.my_geely_ex5_door_rear_left': 'rear left door',
        'binary_sensor.my_geely_ex5_door_rear_right': 'rear right door',
        'binary_sensor.my_geely_ex5_trunk': 'trunk',
        'binary_sensor.my_geely_ex5_hood': 'hood' } -%}
      {%- for eid, label in openings.items() -%}
        {%- if is_state(eid, 'on') -%}
          {%- set ns.open = ns.open + [label] -%}
        {%- endif -%}
      {%- endfor -%}
      {%- if ns.open | count > 0 -%}
        {%- set ns.items = ns.items + ['**Open:** ' ~ (ns.open | join(', '))] -%}
        {%- set ns.urgent = true -%}
      {%- endif -%}

      {#- 3. Central lock. Only the two states that definitely mean "not
             secure" count, so "unavailable" or "unknown" never raises a
             false alarm. -#}
      {%- if states('lock.my_geely_ex5_doors') in ['unlocked', 'open'] -%}
        {%- set ns.items = ns.items + ['**Doors are unlocked**'] -%}
        {%- set ns.urgent = true -%}
      {%- endif -%}

      {#- 4. Traction battery. The fallback is 100, never 0: a car that
             has not reported must not read as empty. -#}
      {%- if has_value('sensor.my_geely_ex5_battery') -%}
        {%- set b = states('sensor.my_geely_ex5_battery') | float(100) -%}
        {%- if b < batt_min -%}
          {%- set ns.items = ns.items + ['**Battery ' ~ (b | round | int) ~ '%** - under ' ~ batt_min ~ '%, worth plugging in'] -%}
        {%- endif -%}
      {%- endif -%}

      {#- 5. Tires, from the psi attribute (see the note above this card).
             "p > 0" skips a parked car whose TPMS sensors are asleep and
             report nothing, and also covers a missing attribute, which
             float(0) turns into 0. The trade-off is that a tire reading
             exactly 0 is never flagged. -#}
      {%- set tires = {
        'sensor.my_geely_ex5_tire_front_left': 'front left',
        'sensor.my_geely_ex5_tire_front_right': 'front right',
        'sensor.my_geely_ex5_tire_rear_left': 'rear left',
        'sensor.my_geely_ex5_tire_rear_right': 'rear right' } -%}
      {%- for eid, label in tires.items() -%}
        {%- set p = state_attr(eid, 'psi') | float(0) -%}
        {%- if p > 0 and p < tire_min_psi -%}
          {%- set ns.low = ns.low + [label ~ ' ' ~ (p | round(1))] -%}
        {%- endif -%}
      {%- endfor -%}
      {%- if ns.low | count > 0 -%}
        {%- set ns.items = ns.items + ['**Tire pressure low:** ' ~ (ns.low | join(', ')) ~ ' psi (under ' ~ tire_min_psi ~ ')'] -%}
      {%- endif -%}

      {#- 6. 12V (accessory) battery. Same "0 means asleep, not flat"
             guard as the tires. -#}
      {%- if has_value('sensor.my_geely_ex5_12v_battery') -%}
        {%- set v = states('sensor.my_geely_ex5_12v_battery') | float(100) -%}
        {%- if v > 0 and v < v12_min -%}
          {%- set ns.items = ns.items + ['**12V battery ' ~ (v | round | int) ~ '%** - a flat 12V leaves the car unable to wake or unlock'] -%}
        {%- endif -%}
      {%- endif -%}

      {#- 7. Service. Days and kilometres are gathered into one line, so a
             car that is close on both does not say "Service" twice. Both
             figures go negative once overdue, so there is no lower bound
             on the test - only the wording changes. The fallbacks are
             huge on purpose: no value means not due. -#}
      {%- if has_value('sensor.my_geely_ex5_days_to_service') -%}
        {%- set d = states('sensor.my_geely_ex5_days_to_service') | float(9999) -%}
        {%- if d < service_days -%}
          {%- set ns.svc = ns.svc + [((d | abs | round | int) ~ ' days overdue') if d < 0 else ('in ' ~ (d | round | int) ~ ' days')] -%}
        {%- endif -%}
      {%- endif -%}
      {%- if has_value('sensor.my_geely_ex5_distance_to_service') -%}
        {%- set k = states('sensor.my_geely_ex5_distance_to_service') | float(99999) -%}
        {%- if k < service_km -%}
          {%- set ns.svc = ns.svc + [((k | abs | round | int) ~ ' km overdue') if k < 0 else ('in ' ~ (k | round | int) ~ ' km')] -%}
        {%- endif -%}
      {%- endif -%}
      {%- if ns.svc | count > 0 -%}
        {%- set ns.items = ns.items + ['**Next service:** ' ~ (ns.svc | join(' / ')) ~ ' - time to book'] -%}
      {%- endif -%}

      {#- Output. Anything to do with security turns the banner red, the
          rest leaves it amber. The bullet list is kept OUTSIDE the
          ha-alert on purpose: markdown inside a raw HTML block is not
          processed, so bold text put in there would render as literal
          asterisks. The blank line below the alert is what closes the
          HTML block and lets the list parse as markdown - do not
          delete it. -#}
      {%- set level = 'error' if ns.urgent else 'warning' -%}
      {%- if ns.items | count == 0 %}
      <ha-alert alert-type="success">All good - nothing needs your attention.</ha-alert>
      {%- else %}
      <ha-alert alert-type="{{ level }}" title="Needs attention">{{ ns.items | count }} {{ 'thing' if ns.items | count == 1 else 'things' }} to look at</ha-alert>

      - {{ ns.items | join('\n- ') }}
      {%- endif -%}

  # A manual poll. The list above only changes when the car reports
  # something new, so after you close a door or lock up, press this and
  # give it a few seconds.
  # "toggle" on a button entity presses it - the same pattern the other
  # cards in this repo use.
  - type: tile
    entity: button.my_geely_ex5_refresh_data
    name: Refresh now
    icon: mdi:refresh
    tap_action:
      action: toggle
