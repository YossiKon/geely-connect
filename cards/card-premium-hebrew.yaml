# ==================================================================
#  Geely EX5 — כרטיס פרימיום בסגנון שלך, מחובר לישויות האמיתיות
#  של האינטגרציה (בלי input_helpers ובלי סקריפטים חיצוniים)
# ==================================================================
#  דרישות (HACS → Frontend):  button-card · stack-in-card · card-mod
#  אופציונלי: תמונת רכב מלמעלה ב- /config/www/geely_car_up.png
#             (לסקשן הצמיגים; אם אין — מחק את בלוק ה-picture-elements)
#
#  לפני הדבקה: החלף בכל הקובץ  my_geely_ex5  בסיומת שלך
#  (Settings → Devices & Services → Geely Connect → הרכב → entity_id)
# ==================================================================

type: custom:stack-in-card
mode: vertical
keep:
  background: true
  border_radius: true
  box_shadow: true
cards:

  # ---------- שורת רענון ----------
  - type: custom:button-card
    show_name: false
    show_icon: true
    icon: mdi:refresh
    show_label: true
    label: רענון נתוני הרכב
    tap_action:
      action: call-service
      service: button.press
      target:
        entity_id: button.my_geely_ex5_refresh_data
    styles:
      card:
        - background: transparent
        - box-shadow: none
        - border: none
        - padding: 16px 20px 6px 20px
      grid:
        - grid-template-areas: "\"i l\""
        - grid-template-columns: min-content 1fr
        - column-gap: 8px
      icon:
        - color: rgba(255,255,255,0.82)
        - width: 20px
      label:
        - color: rgba(255,255,255,0.82)
        - font-size: 15px
        - font-weight: 600
        - justify-self: start

  # ---------- כותרת: מידע על הרכב ----------
  - type: custom:button-card
    name: מידע על הרכב
    tap_action: {action: none}
    styles:
      card: [{background: transparent}, {box-shadow: none}, {border: none}, {padding: 6px 20px 4px 20px}]
      name: [{color: white}, {justify-self: end}, {width: 100%}, {text-align: right}, {font-size: 18px}, {font-weight: 800}]

  # ---------- בלוק המידע הראשי ----------
  - type: custom:button-card
    show_name: false
    show_icon: false
    tap_action: {action: none}
    triggers_update: all
    custom_fields:
      content: |
        [[[
          const st = (id, d="-") => states[id]?.state ?? d;
          const num = (id, d=0) => Number(states[id]?.state ?? d);

          const battery = Math.max(0, Math.min(100, num("sensor.my_geely_ex5_battery")));
          const range = Math.max(0, num("sensor.my_geely_ex5_electric_range"));
          const rangePct = Math.max(0, Math.min(100, (range / 430) * 100));
          const consumption = st("sensor.my_geely_ex5_average_consumption");
          const totalKm = Math.round(num("sensor.my_geely_ex5_total_mileage")).toLocaleString();
          const insideTemp = st("sensor.my_geely_ex5_interior_temperature");
          const outsideTemp = st("sensor.my_geely_ex5_exterior_temperature");
          const v12 = st("sensor.my_geely_ex5_12v_battery");
          const service = st("sensor.my_geely_ex5_days_to_service");

          // --- מיזוג: ישירות מישות ה-climate ---
          const clim = states["climate.my_geely_ex5_climate"];
          const acOn = clim && clim.state !== "off" && clim.state !== "unavailable";
          const acTemp = clim?.attributes?.temperature ?? "-";
          const preset = clim?.attributes?.preset_mode;
          let acStatus = acOn ? `מיזוג דלוק · ${acTemp}°` : "מיזוג כבוי";
          if (preset === "Rapid Warming") acStatus = "🔥 חימום מהיר פעיל";
          if (preset === "Rapid Cooling") acStatus = "❄️ קירור מהיר פעיל";

          // --- טעינה ---
          const plugged = states["binary_sensor.my_geely_ex5_charger_plug"]?.state === "on";
          const charging = states["switch.my_geely_ex5_charging"]?.state === "on";
          const ttf = num("sensor.my_geely_ex5_time_to_full_charge");
          let chargeLine = "";
          if (charging && ttf > 0) {
            const h = Math.floor(ttf/60), m = ttf%60;
            chargeLine = `⚡ בטעינה · נותרו ${h > 0 ? h + " שע׳ " : ""}${m} דק׳`;
          } else if (plugged) {
            chargeLine = "🔌 מחובר לעמדה (לא טוען)";
          }

          const batteryColor =
            battery >= 60 ? "linear-gradient(90deg,#00e676,#00c853)" :
            battery >= 30 ? "linear-gradient(90deg,#ffca28,#ffb300)" :
            "linear-gradient(90deg,#ff5252,#e53935)";
          const rangeColor =
            rangePct >= 60 ? "linear-gradient(90deg,#42a5f5,#1e88e5)" :
            rangePct >= 30 ? "linear-gradient(90deg,#ffca28,#ffb300)" :
            "linear-gradient(90deg,#ff5252,#e53935)";

          return `
            <div style="width:100%;margin:0 auto;text-align:center;box-sizing:border-box;">
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;width:100%;margin-top:6px;">
                <div>
                  <div style="display:flex;justify-content:center;gap:8px;align-items:center;margin-bottom:8px;">
                    <span style="color:rgba(255,255,255,0.72);font-size:15px;font-weight:700;">סוללה</span>
                    <span style="color:white;font-size:24px;font-weight:800;">${battery}%</span>
                  </div>
                  <div style="width:100%;height:14px;background:rgba(255,255,255,0.10);border-radius:999px;overflow:hidden;">
                    <div style="width:${battery}%;height:100%;background:${batteryColor};border-radius:999px;${charging ? "animation:pulse 1.6s ease-in-out infinite;" : ""}"></div>
                  </div>
                </div>
                <div>
                  <div style="display:flex;justify-content:center;gap:8px;align-items:center;margin-bottom:8px;">
                    <span style="color:rgba(255,255,255,0.72);font-size:15px;font-weight:700;">טווח</span>
                    <span style="color:white;font-size:24px;font-weight:800;">${range} ק"מ</span>
                  </div>
                  <div style="width:100%;height:14px;background:rgba(255,255,255,0.10);border-radius:999px;overflow:hidden;">
                    <div style="width:${rangePct}%;height:100%;background:${rangeColor};border-radius:999px;"></div>
                  </div>
                </div>
              </div>

              ${chargeLine ? `<div style="margin-top:14px;color:#4fc3f7;font-size:15px;font-weight:700;">${chargeLine}</div>` : ""}

              <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px 20px;margin-top:22px;max-width:430px;margin-left:auto;margin-right:auto;">
                <div>
                  <div style="color:rgba(255,255,255,0.60);font-size:12px;">צריכה</div>
                  <div style="color:white;font-size:20px;font-weight:800;">${consumption}</div>
                </div>
                <div>
                  <div style="color:rgba(255,255,255,0.60);font-size:12px;">סה"כ ק"מ</div>
                  <div style="color:white;font-size:20px;font-weight:800;">${totalKm}</div>
                </div>
                <div>
                  <div style="color:rgba(255,255,255,0.60);font-size:12px;">מצבר 12V</div>
                  <div style="color:white;font-size:20px;font-weight:800;">${v12}%</div>
                </div>
                <div>
                  <div style="color:rgba(255,255,255,0.60);font-size:12px;">טמפ׳ בפנים</div>
                  <div style="color:white;font-size:20px;font-weight:800;">${insideTemp}°</div>
                </div>
                <div>
                  <div style="color:rgba(255,255,255,0.60);font-size:12px;">טמפ׳ בחוץ</div>
                  <div style="color:white;font-size:20px;font-weight:800;">${outsideTemp}°</div>
                </div>
                <div>
                  <div style="color:rgba(255,255,255,0.60);font-size:12px;">ימים לטיפול</div>
                  <div style="color:white;font-size:20px;font-weight:800;">${service}</div>
                </div>
              </div>

              <div style="margin-top:22px;max-width:430px;margin-left:auto;margin-right:auto;">
                <div style="color:rgba(255,255,255,0.58);font-size:12px;">מצב מזגן</div>
                <div style="color:white;font-size:18px;font-weight:700;margin-top:2px;">${acStatus}</div>
              </div>
            </div>
            <style>@keyframes pulse {0%,100%{opacity:1} 50%{opacity:.55}}</style>
          `;
        ]]]
    styles:
      card: [{background: transparent}, {box-shadow: none}, {border: none}, {padding: 2px 20px 8px 20px}]
      custom_fields:
        content: [{width: 100%}]

  # ---------- שורת סטטוס דלתות ונעילה ----------
  - type: custom:button-card
    show_name: false
    show_icon: false
    tap_action: {action: none}
    triggers_update: all
    custom_fields:
      content: |
        [[[
          const open = id => states[id]?.state === "on";
          const items = [
            ["דלת נהג",   open("binary_sensor.my_geely_ex5_door_driver")],
            ["דלת נוסע",  open("binary_sensor.my_geely_ex5_door_passenger")],
            ["אח׳ שמאל",  open("binary_sensor.my_geely_ex5_door_rear_left")],
            ["אח׳ ימין",  open("binary_sensor.my_geely_ex5_door_rear_right")],
            ["תא מטען",   open("binary_sensor.my_geely_ex5_trunk")],
            ["מכסה מנוע", open("binary_sensor.my_geely_ex5_hood")],
          ];
          const openOnes = items.filter(i => i[1]);
          const locked = states["lock.my_geely_ex5_doors"]?.state === "locked";
          const lockBadge = locked
            ? `<span style="color:#69f0ae;font-weight:800;">🔒 נעול</span>`
            : `<span style="color:#ff8a80;font-weight:800;">🔓 לא נעול</span>`;
          const doors = openOnes.length === 0
            ? `<span style="color:#69f0ae;font-weight:700;">✓ הכל סגור</span>`
            : openOnes.map(i => `<span style="color:#ff8a80;font-weight:700;">⚠ ${i[0]} פתוח</span>`).join(" · ");
          return `<div style="display:flex;justify-content:center;gap:16px;flex-wrap:wrap;font-size:14px;">${lockBadge}${"&nbsp;·&nbsp;"}${doors}</div>`;
        ]]]
    styles:
      card: [{background: transparent}, {box-shadow: none}, {border: none}, {padding: 0 20px 10px 20px}]
      custom_fields:
        content: [{width: 100%}]

  # ---------- פעולות מהירות ----------
  - type: grid
    columns: 4
    square: false
    cards:
      - type: custom:button-card
        entity: lock.my_geely_ex5_doors
        name: |
          [[[ return entity.state === "locked" ? "פתח נעילה" : "נעל רכב"; ]]]
        icon: |
          [[[ return entity.state === "locked" ? "mdi:lock-open-variant" : "mdi:lock"; ]]]
        tap_action:
          action: call-service
          service: |
            [[[ return entity.state === "locked" ? "lock.unlock" : "lock.lock"; ]]]
          target:
            entity_id: lock.my_geely_ex5_doors
        styles:
          card:
            - border-radius: 16px
            - padding: 10px
            - height: 78px
            - border: none
            - box-shadow: none
            - background: |
                [[[ return entity.state === "locked"
                    ? "linear-gradient(145deg,rgba(0,200,83,0.28),rgba(0,150,60,0.14))"
                    : "linear-gradient(145deg,rgba(255,82,82,0.30),rgba(198,40,40,0.16))"; ]]]
          icon: [{color: white}, {width: 24px}]
          name: [{color: white}, {font-size: 13px}, {font-weight: 700}]
      - type: custom:button-card
        name: מצא רכב
        icon: mdi:car-search
        tap_action:
          action: call-service
          service: button.press
          target: {entity_id: button.my_geely_ex5_find_car}
        styles:
          card: [{border-radius: 16px}, {padding: 10px}, {height: 78px}, {border: none}, {box-shadow: none}, {background: "linear-gradient(145deg,rgba(171,71,188,0.28),rgba(123,31,162,0.14))"}]
          icon: [{color: white}, {width: 24px}]
          name: [{color: white}, {font-size: 13px}, {font-weight: 700}]
      - type: custom:button-card
        name: תא מטען
        icon: mdi:car-back
        tap_action:
          action: call-service
          service: button.press
          target: {entity_id: button.my_geely_ex5_unlock_trunk}
        styles:
          card: [{border-radius: 16px}, {padding: 10px}, {height: 78px}, {border: none}, {box-shadow: none}, {background: "linear-gradient(145deg,rgba(255,167,38,0.28),rgba(230,120,20,0.14))"}]
          icon: [{color: white}, {width: 24px}]
          name: [{color: white}, {font-size: 13px}, {font-weight: 700}]
      - type: custom:button-card
        entity: switch.my_geely_ex5_charging
        name: |
          [[[ return entity.state === "on" ? "עצור טעינה" : "התחל טעינה"; ]]]
        icon: mdi:ev-station
        tap_action: {action: toggle}
        styles:
          card:
            - border-radius: 16px
            - padding: 10px
            - height: 78px
            - border: none
            - box-shadow: none
            - background: |
                [[[ return entity.state === "on"
                    ? "linear-gradient(145deg,#00c853,#00913c)"
                    : "linear-gradient(145deg,rgba(0,200,83,0.22),rgba(0,150,60,0.10))"; ]]]
          icon: [{color: white}, {width: 24px}]
          name: [{color: white}, {font-size: 13px}, {font-weight: 700}]

  # ---------- ניווט למיקום הרכב ----------
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:button-card
        name: נווט עם Waze
        icon: mdi:waze
        tap_action:
          action: url
          url_path: |
            [[[
              const t = states["device_tracker.my_geely_ex5_location"]?.attributes || {};
              return `https://waze.com/ul?ll=${t.latitude},${t.longitude}&navigate=yes`;
            ]]]
        styles:
          card: [{border-radius: 14px}, {padding: 8px 6px}, {height: 74px}, {border: none}, {box-shadow: none}, {background: "linear-gradient(145deg,rgba(0,188,212,0.24),rgba(0,151,167,0.14))"}]
          icon: [{color: white}, {width: 26px}]
          name: [{color: white}, {font-size: 13px}, {font-weight: 700}]
      - type: custom:button-card
        name: Google Maps
        icon: mdi:google-maps
        tap_action:
          action: url
          url_path: |
            [[[
              const t = states["device_tracker.my_geely_ex5_location"]?.attributes || {};
              return `https://www.google.com/maps/search/?api=1&query=${t.latitude},${t.longitude}`;
            ]]]
        styles:
          card: [{border-radius: 14px}, {padding: 8px 6px}, {height: 74px}, {border: none}, {box-shadow: none}, {background: "linear-gradient(145deg,rgba(66,133,244,0.24),rgba(30,136,229,0.14))"}]
          icon: [{color: white}, {width: 26px}]
          name: [{color: white}, {font-size: 13px}, {font-weight: 700}]

  # ---------- כותרת: בקרת אקלים ----------
  - type: custom:button-card
    name: בקרת אקלים
    tap_action: {action: none}
    styles:
      card: [{background: transparent}, {box-shadow: none}, {border: none}, {padding: 12px 20px 6px 20px}]
      name: [{color: white}, {justify-self: end}, {width: 100%}, {text-align: right}, {font-size: 16px}, {font-weight: 800}]

  # ---------- טמפרטורת מזגן: -/+ והפעלה ----------
  - type: grid
    columns: 4
    square: false
    cards:
      - type: custom:button-card
        icon: mdi:minus
        name: ""
        tap_action:
          action: call-service
          service: climate.set_temperature
          target: {entity_id: climate.my_geely_ex5_climate}
          data:
            temperature: |
              [[[
                const t = Number(states["climate.my_geely_ex5_climate"]?.attributes?.temperature || 22);
                return Math.max(15.5, t - 0.5);
              ]]]
        styles:
          card: [{border-radius: 16px}, {height: 64px}, {border: none}, {box-shadow: none}, {background: "rgba(255,255,255,0.07)"}]
          icon: [{color: white}, {width: 22px}]
      - type: custom:button-card
        entity: climate.my_geely_ex5_climate
        show_icon: false
        show_name: false
        show_state: false
        custom_fields:
          t: |
            [[[
              const c = states["climate.my_geely_ex5_climate"];
              const on = c && c.state !== "off";
              const t = c?.attributes?.temperature ?? "-";
              return `<div style="text-align:center;">
                <div style="color:white;font-size:24px;font-weight:800;">${t}°</div>
                <div style="color:${on ? "#69f0ae" : "rgba(255,255,255,0.55)"};font-size:12px;font-weight:700;">${on ? "פועל" : "כבוי"}</div>
              </div>`;
            ]]]
        tap_action: {action: more-info}
        styles:
          card: [{border-radius: 16px}, {height: 64px}, {border: none}, {box-shadow: none}, {background: "rgba(255,255,255,0.05)"}]
      - type: custom:button-card
        icon: mdi:plus
        name: ""
        tap_action:
          action: call-service
          service: climate.set_temperature
          target: {entity_id: climate.my_geely_ex5_climate}
          data:
            temperature: |
              [[[
                const t = Number(states["climate.my_geely_ex5_climate"]?.attributes?.temperature || 22);
                return Math.min(28.5, t + 0.5);
              ]]]
        styles:
          card: [{border-radius: 16px}, {height: 64px}, {border: none}, {box-shadow: none}, {background: "rgba(255,255,255,0.07)"}]
          icon: [{color: white}, {width: 22px}]
      - type: custom:button-card
        entity: climate.my_geely_ex5_climate
        name: |
          [[[ return entity.state === "off" ? "הדלק מזגן" : "כבה מזגן"; ]]]
        icon: mdi:power
        tap_action:
          action: call-service
          service: climate.set_hvac_mode
          target: {entity_id: climate.my_geely_ex5_climate}
          data:
            hvac_mode: |
              [[[ return entity.state === "off" ? "heat_cool" : "off"; ]]]
        styles:
          card:
            - border-radius: 16px
            - height: 64px
            - border: none
            - box-shadow: none
            - background: |
                [[[ return entity.state === "off"
                    ? "rgba(255,255,255,0.07)"
                    : "linear-gradient(145deg,#ef5350,#c62828)"; ]]]
          icon: [{color: white}, {width: 22px}]
          name: [{color: white}, {font-size: 12px}, {font-weight: 700}]

  # ---------- כפתורי אקלים ----------
  - type: grid
    columns: 3
    square: false
    cards:
      - type: custom:button-card
        entity: climate.my_geely_ex5_climate
        name: חימום מהיר
        icon: mdi:fire
        tap_action:
          action: call-service
          service: climate.set_preset_mode
          target: {entity_id: climate.my_geely_ex5_climate}
          data:
            preset_mode: |
              [[[ return entity.attributes?.preset_mode === "Rapid Warming" ? "none" : "Rapid Warming"; ]]]
        styles:
          card:
            - border-radius: 16px
            - padding: 10px
            - height: 72px
            - border: none
            - box-shadow: none
            - background: |
                [[[ return entity.attributes?.preset_mode === "Rapid Warming"
                    ? "linear-gradient(145deg,#ff7043,#f4511e)" : "rgba(255,255,255,0.07)"; ]]]
          icon: [{color: white}, {width: 24px}]
          name: [{color: white}, {font-size: 14px}, {font-weight: 700}]
      - type: custom:button-card
        entity: climate.my_geely_ex5_climate
        name: קירור מהיר
        icon: mdi:snowflake
        tap_action:
          action: call-service
          service: climate.set_preset_mode
          target: {entity_id: climate.my_geely_ex5_climate}
          data:
            preset_mode: |
              [[[ return entity.attributes?.preset_mode === "Rapid Cooling" ? "none" : "Rapid Cooling"; ]]]
        styles:
          card:
            - border-radius: 16px
            - padding: 10px
            - height: 72px
            - border: none
            - box-shadow: none
            - background: |
                [[[ return entity.attributes?.preset_mode === "Rapid Cooling"
                    ? "linear-gradient(145deg,#42a5f5,#1e88e5)" : "rgba(255,255,255,0.07)"; ]]]
          icon: [{color: white}, {width: 24px}]
          name: [{color: white}, {font-size: 14px}, {font-weight: 700}]
      - type: custom:button-card
        entity: switch.my_geely_ex5_defrost
        name: הפשרה
        icon: mdi:car-defrost-front
        tap_action: {action: toggle}
        styles:
          card:
            - border-radius: 16px
            - padding: 10px
            - height: 72px
            - border: none
            - box-shadow: none
            - background: |
                [[[ return entity.state === "on"
                    ? "linear-gradient(145deg,#26c6da,#0097a7)" : "rgba(255,255,255,0.07)"; ]]]
          icon: [{color: white}, {width: 24px}]
          name: [{color: white}, {font-size: 14px}, {font-weight: 700}]
      - type: custom:button-card
        entity: switch.my_geely_ex5_window_ventilation
        name: אוורור חלונות
        icon: mdi:window-open-variant
        tap_action: {action: toggle}
        styles:
          card:
            - border-radius: 16px
            - padding: 10px
            - height: 72px
            - border: none
            - box-shadow: none
            - background: |
                [[[ return entity.state === "on"
                    ? "linear-gradient(145deg,#26a69a,#00796b)" : "rgba(255,255,255,0.07)"; ]]]
          icon: [{color: white}, {width: 24px}]
          name: [{color: white}, {font-size: 14px}, {font-weight: 700}]
      - type: custom:button-card
        entity: switch.my_geely_ex5_g_clean
        name: ריענון אוויר
        icon: mdi:air-purifier
        tap_action: {action: toggle}
        styles:
          card:
            - border-radius: 16px
            - padding: 10px
            - height: 72px
            - border: none
            - box-shadow: none
            - background: |
                [[[ return entity.state === "on"
                    ? "linear-gradient(145deg,#9ccc65,#689f38)" : "rgba(255,255,255,0.07)"; ]]]
          icon: [{color: white}, {width: 24px}]
          name: [{color: white}, {font-size: 14px}, {font-weight: 700}]
      - type: custom:button-card
        entity: select.my_geely_ex5_seat_heat_driver
        name: |
          [[[ return "חימום מושב · " + (entity.state === "unavailable" ? "-" : entity.state); ]]]
        icon: mdi:car-seat-heater
        tap_action:
          action: call-service
          service: select.select_next
          target: {entity_id: select.my_geely_ex5_seat_heat_driver}
          data: {cycle: true}
        hold_action: {action: more-info}
        styles:
          card:
            - border-radius: 16px
            - padding: 10px
            - height: 72px
            - border: none
            - box-shadow: none
            - background: |
                [[[ return entity.state !== "Off" && entity.state !== "unavailable"
                    ? "linear-gradient(145deg,#ef5350,#c62828)" : "rgba(255,255,255,0.07)"; ]]]
          icon: [{color: white}, {width: 24px}]
          name: [{color: white}, {font-size: 12px}, {font-weight: 700}]

  # ---------- טעינה מתוזמנת ----------
  - type: custom:button-card
    name: טעינה מתוזמנת
    tap_action: {action: none}
    styles:
      card: [{background: transparent}, {box-shadow: none}, {border: none}, {padding: 12px 20px 6px 20px}]
      name: [{color: white}, {justify-self: end}, {width: 100%}, {text-align: right}, {font-size: 16px}, {font-weight: 800}]
  - type: grid
    columns: 3
    square: false
    cards:
      - type: custom:button-card
        entity: switch.my_geely_ex5_scheduled_charging
        name: |
          [[[ return entity.state === "on" ? "מתוזמן ✓" : "לא פעיל"; ]]]
        icon: mdi:calendar-clock
        tap_action: {action: toggle}
        styles:
          card:
            - border-radius: 16px
            - padding: 10px
            - height: 68px
            - border: none
            - box-shadow: none
            - background: |
                [[[ return entity.state === "on"
                    ? "linear-gradient(145deg,#5c6bc0,#3949ab)" : "rgba(255,255,255,0.07)"; ]]]
          icon: [{color: white}, {width: 22px}]
          name: [{color: white}, {font-size: 13px}, {font-weight: 700}]
      - type: custom:button-card
        entity: time.my_geely_ex5_scheduled_charging_start
        name: התחלה
        show_state: true
        icon: mdi:clock-start
        tap_action: {action: more-info}
        styles:
          card: [{border-radius: 16px}, {padding: 10px}, {height: 68px}, {border: none}, {box-shadow: none}, {background: "rgba(255,255,255,0.07)"}]
          icon: [{color: white}, {width: 22px}]
          name: [{color: "rgba(255,255,255,0.65)"}, {font-size: 11px}, {font-weight: 700}]
          state: [{color: white}, {font-size: 15px}, {font-weight: 800}]
      - type: custom:button-card
        entity: time.my_geely_ex5_scheduled_charging_end
        name: סיום
        show_state: true
        icon: mdi:clock-end
        tap_action: {action: more-info}
        styles:
          card: [{border-radius: 16px}, {padding: 10px}, {height: 68px}, {border: none}, {box-shadow: none}, {background: "rgba(255,255,255,0.07)"}]
          icon: [{color: white}, {width: 22px}]
          name: [{color: "rgba(255,255,255,0.65)"}, {font-size: 11px}, {font-weight: 700}]
          state: [{color: white}, {font-size: 15px}, {font-weight: 800}]

  # ---------- כותרת: לחץ צמיגים ----------
  - type: custom:button-card
    name: לחץ צמיגים
    tap_action: {action: none}
    styles:
      card: [{background: transparent}, {box-shadow: none}, {border: none}, {padding: 12px 20px 8px 20px}]
      name: [{color: white}, {justify-self: end}, {width: 100%}, {text-align: right}, {font-size: 16px}, {font-weight: 800}]

  # ---------- צמיגים על תמונת הרכב ----------
  # דורש תמונה ב- /config/www/geely_car_up.png  (רכב מלמעלה)
  # אם אין לך תמונה — מחק את הבלוק הזה; במקומו יש גריד רזרבי למטה.
  - type: picture-elements
    image: /local/geely_car_up.png
    card_mod:
      style: |
        ha-card { background: transparent !important; box-shadow: none !important; border: none !important; }
    elements:
      - type: state-label
        entity: sensor.my_geely_ex5_tire_front_left
        prefix: "קד׳ שמאל: "
        style: {top: 25%, left: 16%, color: white, font-size: 16px, font-weight: 800, transform: "translate(-50%,-50%)", text-shadow: "0 1px 6px rgba(0,0,0,0.7)"}
      - type: state-label
        entity: sensor.my_geely_ex5_tire_front_right
        prefix: "קד׳ ימין: "
        style: {top: 25%, left: 84%, color: white, font-size: 16px, font-weight: 800, transform: "translate(-50%,-50%)", text-shadow: "0 1px 6px rgba(0,0,0,0.7)"}
      - type: state-label
        entity: sensor.my_geely_ex5_tire_rear_left
        prefix: "אח׳ שמאל: "
        style: {top: 75%, left: 16%, color: white, font-size: 16px, font-weight: 800, transform: "translate(-50%,-50%)", text-shadow: "0 1px 6px rgba(0,0,0,0.7)"}
      - type: state-label
        entity: sensor.my_geely_ex5_tire_rear_right
        prefix: "אח׳ ימין: "
        style: {top: 75%, left: 84%, color: white, font-size: 16px, font-weight: 800, transform: "translate(-50%,-50%)", text-shadow: "0 1px 6px rgba(0,0,0,0.7)"}

card_mod:
  style: |
    ha-card {
      direction: rtl;
      border-radius: 30px;
      overflow: hidden;
      background:
        radial-gradient(circle at top right, rgba(0,229,255,0.10), transparent 22%),
        radial-gradient(circle at top left, rgba(255,255,255,0.05), transparent 18%),
        linear-gradient(145deg, #09111d 0%, #102033 38%, #16314d 100%);
      box-shadow: 0 18px 45px rgba(0,0,0,0.48);
      border: 1px solid rgba(255,255,255,0.06);
    }
