blueprint:
  name: Geely Connect - Pre-condition climate before departure
  description: Turn on the car climate at a set time on selected days.
  domain: automation
  input:
    climate_entity:
      name: Climate entity
      selector:
        entity: { domain: climate }
    departure_time:
      name: Start time
      selector:
        time: {}
    days:
      name: Days
      default: [mon, tue, wed, thu, fri]
      selector:
        select:
          multiple: true
          options: [mon, tue, wed, thu, fri, sat, sun]
    target_temp:
      name: Target temperature (°C)
      default: 22
      selector:
        number: { min: 15.5, max: 28.5, step: 0.5, unit_of_measurement: "°C" }
    climate_temperature_unit:
      name: Home Assistant temperature unit
      description: >-
        The unit Home Assistant uses: Settings > System > General > Unit
        system - Metric is °C, US customary is °F. The target above stays in
        Celsius; climate services use this HA unit, which can differ from an
        individual temperature sensor's unit.
      default: "°C"
      selector:
        select:
          options: ["°C", "°F"]
variables:
  allowed_days: !input days
  target_temp_c: !input target_temp
  climate_temperature_unit: !input climate_temperature_unit
trigger:
  - platform: time
    at: !input departure_time
condition:
  - condition: template
    value_template: "{{ now().strftime('%a').lower() in allowed_days }}"
action:
  # One command, deliberately. set_temperature already switches the climate on -
  # it sends rce.conditioner + rce.temp together - so a following set_hvac_mode
  # was both redundant and harmful: the car executes one remote command at a
  # time and rejects the next with "the last request has not yet been executed",
  # which is what left an owner's climate not running in issue #19.
  - service: climate.set_temperature
    target: { entity_id: !input climate_entity }
    data:
      # A Fahrenheit target is moved a hair toward mid-range: HA converts it
      # back to Celsius, and 59.9 F would arrive as 15.499999999999998 C.
      temperature: >-
        {{ target_temp_c * 9 / 5 + 32 + (0.000000001 if target_temp_c < 22 else -0.000000001)
           if climate_temperature_unit == '°F' else target_temp_c }}
mode: single
