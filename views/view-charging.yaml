# =====================================================================
#  Geely Connect - CHARGING view (built-in Home Assistant cards only).
#  No HACS / custom cards needed.
#
#  WHAT THIS IS
#    One dashboard view built around charging: battery gauge, range now
#    and range at a full charge, the charging and scheduled-charging
#    controls, plug and connection status, the live charge rate,
#    consumption / efficiency, and a week of battery history.
#
#  WHERE TO PASTE IT
#    Settings -> Dashboards -> open your dashboard -> pencil (Edit) ->
#    3-dot menu -> Raw configuration editor.
#    Paste this whole block as one more item under the top-level
#    "views:" key, keeping the indentation below exactly as it is: the
#    "- title: Charging" line must line up with the "- title:" lines
#    that are already there. Then Save.
#    Starting from an empty dashboard instead? Put a single line
#    "views:" at the top, then paste this block below it.
#
#  BEFORE YOU SAVE
#    Search-replace  my_geely_ex5  with your own entity suffix. Find it
#    under Settings -> Devices & Services -> Geely Connect -> your car:
#    ids look like  sensor.my_geely_ex5_battery , so the suffix is
#    my_geely_ex5 .
#    This view calls no notify service, so there is no
#    notify.mobile_app_... to search-replace here. If you later add
#    one, remember to swap it for your own notifier too.
#
#  Anything your car does not report shows as "unavailable" - just
#  delete that card.
# =====================================================================
- title: Charging
  path: charging
  icon: mdi:ev-station
  type: sections
  max_columns: 2
  sections:

    # ============ State of charge ============
    - type: grid
      cards:
        - type: heading
          heading: State of charge
          heading_style: title
          icon: mdi:battery-charging-medium

        # Severity keys are the LOWER bound of each colour band:
        #   red 0-20  |  yellow 20-40  |  green 40-100
        - type: gauge
          entity: sensor.my_geely_ex5_battery
          name: Battery
          min: 0
          max: 100
          needle: false
          severity:
            red: 0
            yellow: 20
            green: 40
          grid_options: {columns: 6, rows: 2}
        - type: tile
          entity: sensor.my_geely_ex5_electric_range
          name: Range now
          icon: mdi:map-marker-distance
          color: blue
          grid_options: {columns: 6}
        # Calculated from the current range and charge level, so it
        # stays "unknown" below 10% - too little charge to extrapolate.
        - type: tile
          entity: sensor.my_geely_ex5_range_at_full_charge
          name: Range at 100%
          icon: mdi:map-marker-check
          grid_options: {columns: 6}

    # ============ Charging now ============
    - type: grid
      cards:
        - type: heading
          heading: Charging now
          heading_style: title
          icon: mdi:ev-plug-type2

        - type: tile
          entity: switch.my_geely_ex5_charging
          name: Charging
          icon: mdi:ev-station
          grid_options: {columns: 12}
        # The rate itself. The car sends volts and amps but never their
        # product, so this is the only place the charge rate exists.
        # Unconditional, unlike the tiles below: 0 kW on an idle car is a
        # true reading, not a stale one.
        - type: tile
          entity: sensor.my_geely_ex5_charging_power
          name: Charging now
          icon: mdi:lightning-bolt
          color: yellow
          grid_options: {columns: 12}
        - type: tile
          entity: sensor.my_geely_ex5_charger_connection
          name: Connection
          grid_options: {columns: 6}
        - type: tile
          entity: binary_sensor.my_geely_ex5_charger_plug
          name: Plug
          icon: mdi:power-plug
          grid_options: {columns: 6}

        # Only rendered while the car actually reports "Charging" - a
        # plugged-in but idle car hides this tile instead of showing a
        # stale finish time.
        - type: conditional
          conditions:
            - condition: state
              entity: sensor.my_geely_ex5_charger_connection
              state: Charging
          card:
            type: tile
            entity: sensor.my_geely_ex5_charge_complete
            name: Charge complete
            icon: mdi:battery-clock
            color: green
          grid_options: {columns: 12}

        # Same gate: while parked, the AC leg reports a small sense
        # current at 0 V, which is real but says nothing about a charge.
        - type: conditional
          conditions:
            - condition: state
              entity: sensor.my_geely_ex5_charger_connection
              state: Charging
          card:
            type: tile
            entity: sensor.my_geely_ex5_charge_voltage
            name: Voltage
            icon: mdi:sine-wave
          grid_options: {columns: 6}
        - type: conditional
          conditions:
            - condition: state
              entity: sensor.my_geely_ex5_charger_connection
              state: Charging
          card:
            type: tile
            entity: sensor.my_geely_ex5_charge_current
            name: Current
            icon: mdi:current-ac
          grid_options: {columns: 6}

    # ============ Scheduled charging ============
    - type: grid
      cards:
        - type: heading
          heading: Scheduled charging
          heading_style: title
          icon: mdi:calendar-clock

        # The start / end times are only obeyed while the switch above
        # them is on; the car keeps them either way.
        - type: tile
          entity: switch.my_geely_ex5_scheduled_charging
          name: Schedule
          grid_options: {columns: 12}
        - type: tile
          entity: time.my_geely_ex5_scheduled_charging_start
          name: Start
          icon: mdi:clock-start
          grid_options: {columns: 6}
        - type: tile
          entity: time.my_geely_ex5_scheduled_charging_end
          name: End
          icon: mdi:clock-end
          grid_options: {columns: 6}

    # ============ Energy use ============
    - type: grid
      cards:
        - type: heading
          heading: Energy use
          heading_style: title
          icon: mdi:lightning-bolt

        - type: tile
          entity: sensor.my_geely_ex5_average_consumption
          name: Consumption
          icon: mdi:gauge
          grid_options: {columns: 6}
        # Efficiency is worked out from consumption, so it follows the
        # same trip window the car uses.
        - type: tile
          entity: sensor.my_geely_ex5_efficiency
          name: Efficiency
          icon: mdi:leaf
          grid_options: {columns: 6}

    # ============ Battery history ============
    - type: grid
      cards:
        - type: heading
          heading: Battery history
          heading_style: title
          icon: mdi:chart-line

        # Long-term statistics, so a week costs nothing to draw. The
        # graph stays empty until Home Assistant has recorded a few
        # hours of battery readings.
        - type: statistics-graph
          title: Battery - last 7 days
          entities:
            - entity: sensor.my_geely_ex5_battery
              name: Battery
          days_to_show: 7
          period: hour
          stat_types:
            - mean
            - min
            - max
          chart_type: line
          grid_options: {columns: 12, rows: 4}
