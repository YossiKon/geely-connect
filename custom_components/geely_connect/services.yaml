fire_rapid:
  name: Fire rapid warm/cool body (probe)
  description: >
    Send the compound rapid warming / rapid cooling command (bizType=7) with a
    body you choose, via POST /charge-server/ecarx_charge_set. For diagnostic
    use: the Rapid Warming and Rapid Cooling presets on the climate entity send
    a fixed version of this body. IMPORTANT - the gateway answers "Success" to
    any well-formed body, including seat positions the car does not recognise,
    so do NOT read the response to decide whether a probe worked. Fire it,
    wait, then read the seat entities (or climateStatus drvVentSts /
    passVentSts / drvHeatSts / passHeatingSts) and see whether they moved.
  fields:
    temp:
      name: Target temperature
      description: AC setpoint in Celsius, as the string the API expects.
      required: true
      example: "15.5"
      selector:
        text:
    ac:
      name: Air conditioning
      description: Whether the bundle turns the climate on.
      required: false
      default: true
      selector:
        boolean:
    heat_seats:
      name: Heated seat positions
      description: >
        Positions to request seat heating for. 11 is the driver and 19 the
        passenger - verified on a real EX5, which warmed both seats from this
        service, so these are the values the climate presets send.
      required: false
      default: []
      example: '["front-left", "front-right"]'
      selector:
        object:
    vent_seats:
      name: Ventilated seat positions
      description: Same positions, for seat ventilation instead of heating.
      required: false
      default: []
      example: '["11", "19"]'
      selector:
        object:
    level:
      name: Seat level
      description: Level applied to every seat in the request. 3 is the highest.
      required: false
      default: "3"
      selector:
        select:
          options:
            - "1"
            - "2"
            - "3"
    window_vent:
      name: Window venting
      description: Crack the windows, as rapid cooling does.
      required: false
      default: false
      selector:
        boolean:
    extra:
      name: Extra body fields
      description: >
        Raw key/value pairs merged into the body last, so they can add an
        undocumented field or override a computed one. This is how to probe
        for controls that have no capture yet. The steering-wheel hunt (#4)
        ended here - the real field turned out to be "sw", found by capture
        after every guessed name ("bw", "steelWheelHeating") was accepted
        and did nothing.
      required: false
      default: {}
      example: '{"sw": "true"}'
      selector:
        object:
    vin:
      name: VIN
      description: VIN of the target vehicle. Optional if you have only one vehicle configured.
      required: false
      example: L6T00000000000000
      selector:
        text:

set_scheduled_trip:
  name: Set scheduled trip
  description: >
    Arm or disarm the official app's "Scheduled trip" - the schedule that
    carries Cabin Comfort and Battery Temperature Maintenance for a departure
    time. The request is the app's own, captured on a real EX5. The car's
    current schedule is read first and sent back unchanged apart from what you
    set here, so the departure is never invented; if the car has no schedule
    and you give no departure, nothing is sent. Not yet confirmed to move a
    real car - judge it by the Battery Temperature Maintenance sensor and the
    app's Scheduled trip screen, never by the response.
  fields:
    command:
      name: Command
      description: start arms the schedule, stop disarms it.
      required: false
      default: start
      selector:
        select:
          options:
            - start
            - stop
    departure:
      name: Departure
      description: >
        The departure date and time, in Home Assistant's time zone. Leave it
        out to keep the departure the car already holds.
      required: false
      example: "2026-10-02 07:00:00"
      selector:
        datetime:
    vin:
      name: VIN
      description: VIN of the target vehicle. Optional if you have only one vehicle configured.
      required: false
      example: L6T00000000000000
      selector:
        text:

fire_control:
  name: Fire control command
  description: >
    Send a raw control command to the vehicle. For diagnostic and
    development use. Lets you fire any serviceId + parameters via the
    standard PUT /remote-control/vehicle/telematics endpoint.
  fields:
    service_id:
      name: Service ID
      description: The Geely serviceId to fire (e.g. RDL_2, RCE_2, RCC_2, RCS).
      required: true
      example: RCE_2
      selector:
        text:
    command:
      name: Command
      description: HTTP command verb sent to the gateway.
      required: false
      default: start
      example: start
      selector:
        select:
          options:
            - start
            - stop
    params:
      name: Parameters
      description: List of {key, value} pairs sent as serviceParameters.
      required: false
      default: []
      example: '[{"key": "rce.conditioner", "value": "1"}, {"key": "rce.temp", "value": "22.0"}]'
      selector:
        object:
    vin:
      name: VIN
      description: VIN of the target vehicle. Optional if you have only one vehicle configured.
      required: false
      example: L6T00000000000000
      selector:
        text:
