name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # No "ignore:" here on purpose. Submitting to the HACS default
          # store requires this action to pass "without any errors or
          # ignores", so an ignore would quietly disqualify the repo.
          # The brands check is satisfied by
          # custom_components/geely_connect/brand/icon.png - it only falls
          # back to home-assistant/brands when that folder is absent.
