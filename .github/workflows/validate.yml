name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The captcha-solver tests need the manifest requirements (pycryptodome
      # etc.), and the entity tests skip themselves unless Home Assistant is
      # importable - so install both and run the whole suite, not just the
      # stdlib-only subset.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -c "import json; print('\n'.join(json.load(open('custom_components/geely_connect/manifest.json'))['requirements']))" > requirements-ci.txt
          python -m pip install -r requirements-ci.txt homeassistant coverage

      # The suite covers every line of the integration; keep it that way.
      # A PR that adds uncovered code fails here - either test it or discuss
      # lowering the bar in the PR.
      - name: Run tests with coverage
        run: |
          python -m coverage run --source=custom_components/geely_connect tests/run.py
          python -m coverage report --fail-under=100 --show-missing

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # No "ignore:" here on purpose. Submitting to the HACS default
          # store requires this action to pass "without any errors or
          # ignores", so an ignore would quietly disqualify the repo.
          # The brands check is satisfied by
          # custom_components/geely_connect/brand/icon.png - it only falls
          # back to home-assistant/brands when that folder is absent.
