name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The offline tests - redaction, transport invariants, request shapes,
      # region resolution - need nothing but the standard library, so they run
      # first and fail fast. The entity tests import Home Assistant and skip
      # themselves without it.
      - name: Run tests
        run: python tests/run.py

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # No "ignore:" here on purpose. Submitting to the HACS default
          # store requires this action to pass "without any errors or
          # ignores", so an ignore would quietly disqualify the repo.
          # The brands check is satisfied by
          # custom_components/geely_connect/brand/icon.png - it only falls
          # back to home-assistant/brands when that folder is absent.
